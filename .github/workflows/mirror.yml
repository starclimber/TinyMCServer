name: Mirror to Codeberg and Gitea

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: mirror-remotes
  cancel-in-progress: false

env:
  CODEBERG_USER: starclimber
  CODEBERG_REPO: TinyMCServer
  CODEBERG_API: https://codeberg.org/api/v1
  GITEA_USER: starclimber
  GITEA_REPO: TinyMCServer
  GITEA_API: https://gitea.com/api/v1
  GH_REPO: starclimber/TinyMCServer

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep release helper script
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mirror-scripts"
          cp -a .github/scripts/. "$RUNNER_TEMP/mirror-scripts/"

      - name: Drop .github/workflows and .github/scripts from mirrored history
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check git-filter-repo
          export PATH="$(python3 -m site --user-base)/bin:$PATH"
          git filter-repo \
            --invert-paths \
            --path .github/workflows \
            --path .github/scripts \
            --force
          if git ls-tree -r --name-only HEAD | grep -qE '^\.github/(workflows|scripts)/'; then
            echo "::error::.github/workflows 或 .github/scripts 仍存在于 HEAD，镜像已中止"
            exit 1
          fi
          echo "镜像保留的 .github 内容："
          git ls-tree -r --name-only HEAD | grep '^\.github/' || true
          echo "HEAD：$(git log --oneline -1)"

      - name: Push code and tags to Codeberg
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CODEBERG_TOKEN:-}" ]; then echo "::error::缺少 CODEBERG_TOKEN"; exit 1; fi

          git config --local credential.helper \
            '!f() { echo "username=${CODEBERG_USER}"; echo "password=${CODEBERG_TOKEN}"; }; f'
          git config --local user.name  "登⭐️者"
          git config --local user.email "288315615+starclimber@users.noreply.github.com"

          remote="https://codeberg.org/${CODEBERG_USER}/${CODEBERG_REPO}.git"
          git remote add codeberg "$remote" 2>/dev/null || git remote set-url codeberg "$remote"
          git push codeberg "HEAD:refs/heads/main" --force
          git push codeberg --tags --force
          git remote remove codeberg || true
          git config --local --unset-all credential.helper || true

      - name: Push code and tags to Gitea
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GITEA_TOKEN:-}" ]; then echo "::warning::缺少 GITEA_TOKEN，跳过 Gitea"; exit 0; fi

          git config --local credential.helper \
            '!f() { echo "username=${GITEA_USER}"; echo "password=${GITEA_TOKEN}"; }; f'
          git config --local user.name  "登⭐️者"
          git config --local user.email "288315615+starclimber@users.noreply.github.com"

          remote="https://gitea.com/${GITEA_USER}/${GITEA_REPO}.git"
          git remote add gitea "$remote" 2>/dev/null || git remote set-url gitea "$remote"
          git push gitea "HEAD:refs/heads/main" --force
          git push gitea --tags --force
          git remote remove gitea || true
          git config --local --unset-all credential.helper || true

      - name: Sync release (with APK) to Codeberg
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/mirror-scripts/sync-release.sh" \
            "$CODEBERG_API" "$CODEBERG_USER" "$CODEBERG_REPO" "$CODEBERG_TOKEN"

      - name: Sync release (with APK) to Gitea
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GITEA_TOKEN:-}" ]; then echo "::warning::缺少 GITEA_TOKEN，跳过 Gitea"; exit 0; fi
          bash "$RUNNER_TEMP/mirror-scripts/sync-release.sh" \
            "$GITEA_API" "$GITEA_USER" "$GITEA_REPO" "$GITEA_TOKEN"
